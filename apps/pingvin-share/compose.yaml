# Pingvin Share X — отправить большой файл по ссылке (как WeTransfer):
# срок жизни ссылки, пароль, лимит скачиваний. Админ (email владельца)
# создаётся при установке, регистрация посторонних закрыта; порт открывается
# только после этого — см. lib/README-gate.md.
name: uno-pingvin-share
services:
  pingvin:
    image: smp46/pingvin-share-x:v1.22.3
    restart: unless-stopped
    environment:
      TRUST_PROXY: "true"
      APP_URL: ${UNO_APP_URL:?this computer has an old Uno agent - update the computer image to install apps}
    volumes:
      - data:/opt/app/backend/data
      - images:/opt/app/frontend/public/img
  init:
    image: curlimages/curl:8.16.0
    depends_on: [pingvin]
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      OWNER_EMAIL: ${UNO_OWNER_EMAIL:?this computer has an old Uno agent - update the computer image to install apps}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
    volumes: ["./init.sh:/init.sh:ro"]
  front:
    image: alpine/socat@sha256:24220ef2c80a2a421ea08e4624488e985330c421b6aa3329bae14b0933a1d403
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
    command: ["TCP-LISTEN:3000,fork,reuseaddr", "TCP:pingvin:3000"]
    ports: ["8094:3000"]
volumes:
  data: {}
  images: {}
