# VPN (WireGuard) с веб-панелью wg-easy: добавить устройство → QR-код для
# приложения WireGuard на телефоне. Ядро машины без модуля WireGuard, поэтому
# туннель — userspace wireguard-go поверх /dev/net/tun (ядро docker-образа).
# UDP: машина принимает 51820/udp, снаружи порт другой (NAT ноды) — его номер
# приходит в UNO_PORT_51820_UDP, и wg-easy слушает/объявляет ровно его.
name: uno-wg-easy
services:
  wg-easy:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/wg-easy/wg-easy:15
        RUN apk add --no-cache wireguard-go
    image: uno-wg-easy:15-userspace
    restart: unless-stopped
    environment:
      PORT: "51821"
      HOST: 0.0.0.0
      INIT_ENABLED: "true"
      INIT_USERNAME: ${ADMIN_USER:-admin}
      INIT_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      INIT_HOST: ${UNO_BOX_HOST:?this computer has an old Uno agent - update the computer image to install apps}
      INIT_PORT: ${UNO_PORT_51820_UDP:?this computer has an old Uno agent - update the computer image to install apps}
      INIT_DNS: "1.1.1.1,8.8.8.8"
      DISABLE_IPV6: "true"
      WG_QUICK_USERSPACE_IMPLEMENTATION: wireguard-go
    ports:
      - "51821:51821/tcp"
      - "51820:${UNO_PORT_51820_UDP}/udp"
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes: [data:/etc/wireguard]
volumes:
  data: {}
