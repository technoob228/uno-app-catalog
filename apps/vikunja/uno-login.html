<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing in with Uno…</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;color:#444}</style>
</head><body><p id="m">Signing in with Uno…</p>
<script>
// «Open» из Uno Work: начать вход через Uno так же, как кнопка «Uno» на
// странице входа Vikunja (helpers/redirectToProvider.ts): state в
// localStorage, redirect_uri = <адрес>/auth/openid/uno. Не вышло — на /login.
(async () => {
  try {
    const info = await (await fetch('/api/v1/info', {credentials: 'omit'})).json();
    const list = (((info || {}).auth || {}).openid_connect || {}).providers || [];
    const p = list.find((x) => x.key === 'uno');
    if (!p || !p.auth_url) throw new Error('no provider');
    const state = Math.random().toString(36).slice(2, 24) + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('state', state);
    const q = new URLSearchParams({client_id: p.client_id, redirect_uri: location.origin + '/auth/openid/uno',
      response_type: 'code', scope: p.scope || 'openid email profile', state});
    location.replace(p.auth_url + (p.auth_url.includes('?') ? '&' : '?') + q.toString());
  } catch (e) {
    location.replace('/login');
  }
})();
</script></body></html>
