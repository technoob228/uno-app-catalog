# Uno Tasks — tasks, boards and notes for you and your team. Made by Uno.
# Sources: technoob228/uno-tasks-app (MIT).
#
# Gate (lib/README-gate.md): the app lets nobody in without Sign in with Uno
# (OIDC, only the owner and people the owner shared the app with) or the owner
# password ADMIN_PASSWORD (generated by Uno, shown on the app card), and it
# never has a "first visitor becomes admin" step — so the port is published
# directly, like Notetaker.
#
# Uno App SDK (docs/app-sdk.md in uno-work): the app writes its manifest
# ~/.uno/apps/uno-tasks.json asking for "ai" {chat, tasks}, "notify",
# "storage" (nightly backups) and a Home "widget"; the daemon issues its token
# into ~/.uno/app-keys/uno-tasks/, mounted read-only — NOT all of ~/.uno.
#
# Data: SQLite in the named volume; notes are markdown files in ~/Notes (Files
# and the agent see them). ~/.uno-tasks/ gets the agent kit: AGENTS.md, a CLI,
# an MCP server and agent.json (url + token, 0600) for agents on the host.
name: uno-tasks
services:
  uno-dirs:
    image: busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        for d in /home/unowork/.uno /home/unowork/.uno/apps /home/unowork/.uno/app-keys /home/unowork/Notes /home/unowork/.uno-tasks; do
          [ -d "$$d" ] || install -d -o 1002 -g 1002 -m 755 "$$d"
        done
        chmod 700 /home/unowork/.uno-tasks
        d=/home/unowork/.uno/app-keys/uno-tasks
        [ -d "$$d" ] || install -d -o 1002 -g 1002 -m 700 "$$d"
        install -d -o 1002 -g 1002 -m 700 /state-init
    volumes:
      - /home/unowork:/home/unowork
      - state:/state-init
  tasks:
    image: ghcr.io/technoob228/uno-tasks:1.0.0
    restart: unless-stopped
    user: "1002:1002"
    depends_on:
      uno-dirs: {condition: service_completed_successfully}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      UNO_APP_URL: ${UNO_APP_URL:?this computer has an old Uno agent - update the computer image to install apps}
      UNO_OWNER_EMAIL: ${UNO_OWNER_EMAIL:-}
      UNO_OIDC_DISCOVERY_URL: ${UNO_OIDC_DISCOVERY_URL:-}
      UNO_OIDC_CLIENT_ID: ${UNO_OIDC_CLIENT_ID:-}
      UNO_OIDC_CLIENT_SECRET: ${UNO_OIDC_CLIENT_SECRET:-}
      UNO_OIDC_OWNER_SUB: ${UNO_OIDC_OWNER_SUB:-}
      HOME: /data
      DATA_DIR: /data
      NOTES_DIR: /notes
      NOTES_DIR_FOR_AGENT: "~/Notes"
      UNO_APPS_DIR: /uno-apps
      UNO_TASKS_AGENT_DIR: /agent-kit
      AGENT_URL: http://127.0.0.1:8440
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - state:/data
      - /home/unowork/Notes:/notes
      - /home/unowork/.uno/apps:/uno-apps
      - /home/unowork/.uno/app-keys/uno-tasks:/run/uno-app:ro
      - /home/unowork/.uno-tasks:/agent-kit
    ports: ["8440:8440"]
    mem_limit: 256m
volumes:
  state: {}
