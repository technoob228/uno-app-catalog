# Memos — быстрые заметки и мысли лентой (как личный Twitter/Keep). SQLite.
# Владелец создаётся при установке, регистрация посторонних закрыта; порт
# открывается только после этого — см. lib/README-gate.md. Вход через аккаунт
# Uno: init заводит провайдера «Uno» и привязывает к нему владельца; новые
# аккаунты — только через Uno (владелец + «Share app» в Uno Work).
name: uno-memos
services:
  memos:
    image: neosmemo/memos:0.31
    restart: unless-stopped
    environment:
      MEMOS_INSTANCE_URL: ${UNO_APP_URL:?this computer has an old Uno agent - update the computer image to install apps}
    volumes: [data:/var/opt/memos]
  init:
    image: curlimages/curl:8.16.0
    depends_on: [memos]
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      ADMIN_USER: owner
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      MEMOS_INSTANCE_URL: ${UNO_APP_URL}
      UNO_OIDC_ISSUER: ${UNO_OIDC_ISSUER:-}
      UNO_OIDC_AUTH_URL: ${UNO_OIDC_AUTH_URL:-}
      UNO_OIDC_TOKEN_URL: ${UNO_OIDC_TOKEN_URL:-}
      UNO_OIDC_USERINFO_URL: ${UNO_OIDC_USERINFO_URL:-}
      UNO_OIDC_CLIENT_ID: ${UNO_OIDC_CLIENT_ID:-}
      UNO_OIDC_CLIENT_SECRET: ${UNO_OIDC_CLIENT_SECRET:-}
    volumes: ["./init.sh:/init.sh:ro"]
  # Ворота + /uno-login (вход через Uno для «Open» из Uno Work).
  front:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ["5230:5230"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "./uno-login.html:/srv/uno-login.html:ro"]
volumes:
  data: {}
