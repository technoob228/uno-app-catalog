# Notetaker — заметки со встреч: запись звонка во вкладке (Meet/Zoom/Teams в
# браузере) или загрузка файла → транскрипт с таймкодами и спикерами →
# итоги, решения, задачи; «спросить о встрече»; ссылка на заметки.
# Исходники: technoob228/uno-notetaker (MIT).
#
# Ворота (lib/README-gate.md): приложение само не пускает никого без пароля
# ADMIN_PASSWORD (его генерирует Uno и показывает в карточке) и без него не
# стартует, поэтому порт публикуется напрямую — «первого открывшего» нет.
#
# 0.3.0: манифест ещё просит "ai.tasks" (пункт «Ask Uno to do it» → задача в
# Uno Work, режим ask), "notify" (Inbox: «Notes ready · 3 action items») и
# "widget" (Home: «Last meeting»). Telegram — собственный бот человека,
# long polling, наружу ничего не открывается. Новых монтов и env нет.
#
# 0.4.0: сервис bot сам заходит в звонки (Meet, Zoom, Teams, Телемост, Zoho)
# гостем «Uno Notetaker» — по календарям человека (iCal-ссылки) или по ссылке.
# Chromium на виртуальном экране + PulseAudio; звук звонка уходит в приложение,
# заметки делает приложение. Бот без ключей и без монтов домашней папки: только
# общий том bot-key (приложение пишет туда токен, открывающий лишь
# /api/bot/worker/*), наружу портов нет. В простое — маленький процесс Python,
# каждый звонок — Chromium на 0.5–1 ГБ (MAX_CALLS=2, потолок памяти 2500m).
# Новых env нет. Исходники бота: technoob228/uno-notetaker, bot/, docs/bot.md.
# 0.4.1: главная честно описывает бота, иконка Record, после обновления
# браузер не держит старый app.js из кэша. Монты и env те же.
#
# ИИ — «ИИ этого компьютера» (Uno App API демона Uno Work, docs/app-sdk.md в
# uno-work): манифест ~/.uno/apps/notetaker.json просит "ai": {"chat": true,
# "tasks": false, "limitUsd": 10}, демон выдаёт приложению СВОЙ токен в
# ~/.uno/app-keys/notetaker/ (расход считается на приложение, потолок $10,
# поднимает человек в Uno Work → Settings → Apps). В контейнер монтируется
# только эта папка (ro, /run/uno-app) и ~/.uno/apps (манифест) — НЕ весь
# ~/.uno: там ключи всех остальных приложений. API демона — на хосте, из
# контейнера через host.docker.internal (extra_hosts).
# UNO_LLM_API_KEY — запасной путь для машин, где у Uno Work ещё нет App API
# (собственный ключ шлюза приложения, llm_key в каталоге). Папку состояния
# Uno Work (/var/lib/uno-work/userdata — ключ машины, ключ кук, токен агента)
# в контейнер НЕ монтируем: ключ машины позволил бы обойти потолок расхода.
#
# PUID/PGID 1002 = пользователь unowork в образе Work (≥153): встречи в
# ~/Meetings принадлежат человеку, «Файлы» их открывают и удаляют.
#
# Данные — в домашней папке человека, чтобы их видели «Файлы» и ИИ машины:
# ~/Meetings/<дата время название>/{audio/, transcript.md, notes.md};
# ~/.uno/apps/notetaker.json — значок на рабочем столе Uno Work.
name: uno-notetaker
services:
  # Один раз от root: папки под bind-монты с владельцем unowork. Иначе docker
  # создаст недостающую папку от root, и демон Uno Work (он работает от
  # unowork) не сможет записать туда ключ приложения. Существующие папки не
  # трогаем (идемпотентно); родителей создаём тоже от unowork — иначе
  # ~/.uno/app-keys стал бы root-овым и ключи других приложений не легли бы.
  uno-dirs:
    image: busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        for d in /home/unowork/.uno /home/unowork/.uno/apps /home/unowork/.uno/app-keys; do
          [ -d "$$d" ] || install -d -o 1002 -g 1002 -m 755 "$$d"
        done
        d=/home/unowork/.uno/app-keys/notetaker
        [ -d "$$d" ] || install -d -o 1002 -g 1002 -m 700 "$$d"
    volumes:
      - /home/unowork:/home/unowork
  notetaker:
    image: ghcr.io/technoob228/uno-notetaker:0.4.1
    restart: unless-stopped
    depends_on:
      uno-dirs: {condition: service_completed_successfully}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}
      UNO_APP_URL: ${UNO_APP_URL:?this computer has an old Uno agent - update the computer image to install apps}
      UNO_LLM_API_KEY: ${UNO_LLM_API_KEY:-}
      UNO_LLM_BASE_URL: ${UNO_LLM_BASE_URL:-https://api.getuno.xyz/v1}
      PUID: "1002"
      PGID: "1002"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - /home/unowork/Meetings:/meetings
      - /home/unowork/.uno/apps:/uno-dot/apps
      - /home/unowork/.uno/app-keys/notetaker:/run/uno-app:ro
      - state:/state
      # Токен для бота: приложение пишет /bot-key/token, бот только читает.
      - bot-key:/bot-key
    ports: ["8430:8430"]
    mem_limit: 1500m
  # Бот звонков. Ходит только в приложение (http://notetaker:8430) и на сайты
  # звонков. Работает от своего пользователя (uid 1000), root ему не нужен:
  # cap_drop ALL + no-new-privileges. shm_size и seccomp не нужны: Chromium
  # запускается с --disable-dev-shm-usage (не упирается в 64 МБ /dev/shm) и без
  # своей песочницы (по умолчанию Playwright), так что user namespaces не нужны.
  bot:
    image: ghcr.io/technoob228/uno-notetaker-bot:0.4.1
    restart: unless-stopped
    depends_on: [notetaker]
    environment:
      NOTETAKER_URL: http://notetaker:8430
      MAX_CALLS: "2"
    volumes:
      - bot-key:/bot-key:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2500m
volumes:
  state: {}
  bot-key: {}
